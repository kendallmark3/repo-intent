name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Intent gate
        run: bash hooks/pre-implement.sh
      - name: Citation checker tests
        run: python3 -m unittest discover -s tests -v
